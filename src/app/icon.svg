<!-- If you edit this file, also regenerate ../favicon.ico by hand (packed manually, not auto-synced) — Safari ignores this SVG and always falls back to favicon.ico -->
<!-- If the brand mark changes, also update ../apple-icon.png by hand — it's an independent PNG (not derived from this file), used for the iOS "Add to Home Screen" icon -->
<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <!-- angle: 123°, distance: 7px, spread: 0%, size: 0px -->
      <feOffset in="SourceAlpha" dx="3.81" dy="5.87" result="offsetAlpha"/>
      <feComponentTransfer in="offsetAlpha" result="shadow">
        <feFuncA type="linear" slope="0.17"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- traced from the original artwork -->
  <path
    filter="url(#dropShadow)"
    fill="#B51D00"
    d="M94,1 L80,72 L24,26 L8,48 L69,87 L9,128 L28,151 L81,102 L102,172 L129,160 L99,97 L171,100 L171,71 L99,77 L124,9 Z"
  />
</svg>