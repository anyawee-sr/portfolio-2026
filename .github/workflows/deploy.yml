name: Deploy to S3 + CloudFront

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_PAGER: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::891376940165:role/GitHubActionsS3Role
          aws-region: ap-southeast-1

      - name: Upload to S3 — hashed assets (immutable)
        run: |
          aws s3 sync ./out/_next/static s3://anyawee-sr.com/_next/static \
            --cache-control "public, max-age=31536000, immutable"

      - name: Upload to S3 — everything else (revalidate)
        run: |
          aws s3 sync ./out s3://anyawee-sr.com \
            --delete \
            --cache-control "public, max-age=300, must-revalidate" \
            --exclude "_next/static/*"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
