name: Deploy to S3

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::891376940165:role/GitHubActionsS3Role
          aws-region: ap-southeast-1

      - name: Upload files to S3
        run: |
          aws s3 sync ./out s3://anyawee-sr-portfolio-2026-891376940165-ap-southeast-1-an --delete
